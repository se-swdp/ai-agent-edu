<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>AI로 편해지는 중</title>
<script>
if(location.protocol==='http:'||location.protocol==='https:'){
  const base=document.createElement('base');
  // 폴더명을 하드코딩하지 않고 URL 에서 유도 — 폴더 rename 에도 안전 (/x, /x/, /x/index.html 모두 처리)
  const p=location.pathname;
  base.href=/\.[^/]+$/.test(p)?p.replace(/[^/]*$/,''):p.replace(/\/?$/,'/');
  document.head.appendChild(base);
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;width:100%;height:100%}
body{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#fcf8f2;color:#1c1c1c;-webkit-font-smoothing:antialiased}
.slides{position:relative;width:100%;height:100%}
/* stacked slides toggled by display — a translateX film strip of N viewport-size
   images creates a huge composited layer that breaks screenshot pipelines */
.slide{position:absolute;inset:0;display:none;justify-content:center;align-items:center;background:#fcf8f2;padding:2.6vh 3vw}
.slide.active{display:flex}
/* never upscale past native 1672x941 — keeps strokes crisp on 1080p fullscreen */
.slide img{width:auto;height:auto;max-width:min(100%,1672px);max-height:min(100%,941px);object-fit:contain;display:block}
.nav{position:fixed;bottom:24px;left:36px;display:flex;gap:6px;z-index:100}
.nav button{width:36px;height:36px;background:rgba(255,255,255,0.75);border:1px solid rgba(28,28,28,0.22);color:rgba(28,28,28,0.65);font-size:14px;cursor:pointer;border-radius:50%;transition:all 0.18s;box-shadow:0 4px 12px rgba(60,50,30,0.10)}
.nav button:hover{background:#fff;color:#1c1c1c;border-color:rgba(28,28,28,0.45)}
.nav button:focus-visible{outline:2px solid #2f73bd;outline-offset:2px}
.page-num{position:fixed;bottom:30px;right:36px;font-size:0.82rem;color:rgba(28,28,28,0.55);letter-spacing:0.06em;font-family:'Noto Sans KR',sans-serif;z-index:100}
.progress{position:fixed;top:0;left:0;height:2px;background:#2f73bd;z-index:200}
@media(max-width:768px){.nav{left:16px;bottom:16px}.page-num{right:16px;bottom:22px}}
@media print{
  html,body{overflow:visible!important;height:auto}
  .nav,.progress,.page-num{display:none!important}
  .slides{display:block!important}
  .slide{display:flex!important;position:relative;page-break-after:always;break-after:page;height:100vh}
}

/* demo slide: the recording plays inside the screen frame drawn on 10-demo.webp */
.demo-video{position:absolute;display:none;object-fit:contain;background:#fcf8f2;border-radius:4px}
.demo-video.ready{display:block}
@media print{.demo-video{display:none!important}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="slides" id="slides">
<div class="slide"><img src="01-title.webp" alt="커버 — AI로 편해지는 중" fetchpriority="high" /></div>
<div class="slide"><img src="02-hook-question.webp" alt="그래서, 편해져요?" loading="lazy" /></div>
<div class="slide"><img src="03-dev-team-changes.webp" alt="올해, 개발팀에서 바뀐 것" loading="lazy" /></div>
<div class="slide"><img src="04-education-spread.webp" alt="올해, 교육이 번진 길" loading="lazy" /></div>
<div class="slide"><img src="05-spread.webp" alt="한 명이 쓰기 시작하면" loading="lazy" /></div>
<div class="slide"><img src="06-coding-first.webp" alt="가장 먼저 좋아진 영역 — 코딩" loading="lazy" /></div>
<div class="slide"><img src="07-work-remains.webp" alt="생각보다 — 일이 다 없어지진 않음" loading="lazy" /></div>
<div class="slide"><img src="08-hardest-work.webp" alt="개발자로서 — 제일 괴로웠던 일" loading="lazy" /></div>
<div class="slide"><img src="09-the-input.webp" alt="이 장들을 만든 입력" loading="lazy" /></div>
<div class="slide demo-slide"><img src="10-demo.webp" alt="만드는 과정 — 녹화 그대로 (데모 영상)" loading="lazy" /><video class="demo-video" src="demo.mp4" preload="metadata" controls playsinline muted></video></div>
<div class="slide"><img src="11-deck-factory.webp" alt="발표자료 공장" loading="lazy" /></div>
<div class="slide"><img src="12-not-just-decks.webp" alt="발표자료만이 아님" loading="lazy" /></div>
<div class="slide"><img src="13-how-to-make-it-good.webp" alt="잘 만들게 하려면" loading="lazy" /></div>
<div class="slide"><img src="14-who-carries-data.webp" alt="자료를 나르는 사람" loading="lazy" /></div>
<div class="slide"><img src="15-one-window.webp" alt="창 하나로" loading="lazy" /></div>
<div class="slide"><img src="16-going-deeper.webp" alt="깊게 들어가면" loading="lazy" /></div>
<div class="slide"><img src="17-numbers-go-wrong.webp" alt="AI가 제일 잘 틀리는 곳 — 숫자" loading="lazy" /></div>
<div class="slide"><img src="18-closing.webp" alt="정리 — 편해지는 건 확실" loading="lazy" /></div>
</div>
<nav aria-label="슬라이드 이동" class="nav"><button aria-label="이전 슬라이드" onclick="prev()">&larr;</button><button aria-label="다음 슬라이드" onclick="next()">&rarr;</button></nav>
<div class="page-num" id="pageNum" aria-live="polite" aria-atomic="true">1 / 1</div>
<script>
const slides=document.querySelectorAll('.slide'),total=slides.length;
let current=0;
const pageNumEl=document.getElementById('pageNum'),progressEl=document.getElementById('progress');
slides.forEach((slide,index)=>{slide.setAttribute('role','group');slide.setAttribute('aria-roledescription','슬라이드');slide.setAttribute('aria-label',`${index+1} / ${total}`);});
function update(){setTimeout(syncDemo,0);slides.forEach((s,i)=>{const active=i===current;s.classList.toggle('active',active);s.setAttribute('aria-hidden',String(!active));});if(!pageNumEl||!progressEl)return;pageNumEl.textContent=`${current+1} / ${total}`;progressEl.style.width=total>1?`${(current/(total-1))*100}%`:'100%';
  [current+1,current+2,current-1].forEach(i=>{if(i>=0&&i<total){const img=slides[i].querySelector('img');if(img&&img.loading==='lazy'){img.loading='eager';}}});
}
function goTo(i){if(total===0)return;if(i<0)i=0;if(i>=total)i=total-1;current=i;try{history.replaceState(null,'','#'+(current+1));}catch(e){}update();}
function next(){goTo(current+1);}
function prev(){goTo(current-1);}
document.addEventListener('keydown',e=>{const tag=document.activeElement.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||document.activeElement.isContentEditable)return;switch(e.key){case'ArrowRight':case' ':case'PageDown':e.preventDefault();next();break;case'ArrowLeft':case'PageUp':e.preventDefault();prev();break;case'Home':e.preventDefault();goTo(0);break;case'End':e.preventDefault();goTo(total-1);break;case'f':case'F':const el=document.documentElement;const isFs=document.fullscreenElement||document.webkitFullscreenElement;if(!isFs){(el.requestFullscreen||el.webkitRequestFullscreen).call(el)?.catch(()=>{});}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)?.catch(()=>{});}break;}});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{if(e.touches.length>1)return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(e.changedTouches.length>1)return;const dx=tx-e.changedTouches[0].clientX,dy=ty-e.changedTouches[0].clientY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){if(dx>0)next();else prev();}},{passive:true});

// screen interior of 10-demo (measured on the 1376x768 source: x 324-1053, y 240-610)
const DEMO_BOX={l:324/1376,t:240/768,w:729/1376,h:370/768};
function placeDemo(){document.querySelectorAll('.demo-slide').forEach(s=>{const img=s.querySelector('img'),v=s.querySelector('video');if(!img||!v)return;const r=img.getBoundingClientRect(),p=s.getBoundingClientRect();if(!r.width)return;v.style.left=(r.left-p.left+r.width*DEMO_BOX.l)+'px';v.style.top=(r.top-p.top+r.height*DEMO_BOX.t)+'px';v.style.width=(r.width*DEMO_BOX.w)+'px';v.style.height=(r.height*DEMO_BOX.h)+'px';});}
function syncDemo(){document.querySelectorAll('.demo-slide').forEach(s=>{const v=s.querySelector('video');if(!v)return;if(s.classList.contains('active')){placeDemo();if(v.classList.contains('ready'))v.play().catch(()=>{});}else if(!v.paused){v.pause();}});}
document.querySelectorAll('.demo-video').forEach(v=>{v.addEventListener('loadeddata',()=>{v.classList.add('ready');syncDemo();});v.addEventListener('error',()=>v.classList.remove('ready'));});
window.addEventListener('resize',placeDemo);
document.addEventListener('keydown',e=>{if(e.key!=='p'&&e.key!=='P')return;const s=document.querySelector('.demo-slide.active video.ready');if(!s)return;e.preventDefault();s.paused?s.play().catch(()=>{}):s.pause();});
const initSlide=parseInt(location.hash.slice(1))-1;
if(!isNaN(initSlide)&&initSlide>=0)goTo(initSlide);else update();
</script>
</body>
</html>
