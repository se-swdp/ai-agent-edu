<title>AX는 왜 어려울까</title>
<script>
if(location.protocol==='http:'||location.protocol==='https:'){

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;width:100%;height:100%}
body{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#fcf8f2;color:#1c1c1c;-webkit-font-smoothing:antialiased}
.slides{position:relative;width:100%;height:100%}
/* stacked slides toggled by display — a translateX film strip of N viewport-size
   images creates a huge composited layer that breaks screenshot pipelines */
.slide{position:absolute;inset:0;display:none;justify-content:center;align-items:center;background:#fcf8f2;padding:2.6vh 3vw}
.slide.active{display:flex}
/* never upscale past native 1376x768 (agy output) — keeps strokes crisp on 1080p fullscreen */
.slide img{width:auto;height:auto;max-width:min(100%,1376px);max-height:min(100%,768px);object-fit:contain;display:block}
.nav{position:fixed;bottom:24px;left:36px;display:flex;gap:6px;z-index:100}
.nav button{width:36px;height:36px;background:rgba(255,255,255,0.75);border:1px solid rgba(28,28,28,0.22);color:rgba(28,28,28,0.65);font-size:14px;cursor:pointer;border-radius:50%;transition:all 0.18s;box-shadow:0 4px 12px rgba(60,50,30,0.10)}
.nav button:hover{background:#fff;color:#1c1c1c;border-color:rgba(28,28,28,0.45)}
.nav button:focus-visible{outline:2px solid #2f73bd;outline-offset:2px}
.page-num{position:fixed;bottom:30px;right:36px;font-size:0.82rem;color:rgba(28,28,28,0.55);letter-spacing:0.06em;font-family:'Noto Sans KR',sans-serif;z-index:100}
.progress{position:fixed;top:0;left:0;height:2px;background:#2f73bd;z-index:200}
@media(max-width:768px){.nav{left:16px;bottom:16px}.page-num{right:16px;bottom:22px}}
@media print{
  html,body{overflow:visible!important;height:auto}
  .nav,.progress,.page-num{display:none!important}
  .slides{display:block!important}
  .slide{display:flex!important;position:relative;page-break-after:always;break-after:page;height:100vh}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="slides" id="slides">
  <!-- SLIDES: one per image, first one without loading="lazy" -->
  <div class="slide"><img src="01-cover.webp" alt="커버 — AX는 왜 어려울까" fetchpriority="high" /></div>
  <div class="slide"><img src="02-hook-live-server.webp" alt="30년째 끄지 못하는 서버 — 바람의나라 1996년 서비스 시작, 2026년 아직 운영 중. 우리가 만든 에이전트는 1년 뒤에도 돌아갈까. 론칭은 하루, 운영은 최소 1년" loading="lazy" /></div>
  <div class="slide"><img src="03-agent-charm.webp" alt="에이전트의 매력 — 작년: 가드레일·스캐폴드·시스템 프롬프트 덕지덕지, 올해: 모델이 알아서 잘함, 걷어낼수록 더 잘함. 모델이 좋아지면 같이 좋아진다. 모델은 알아서 좋아진다, 운영은 알아서 좋아지지 않는다" loading="lazy" /></div>
  <div class="slide"><img src="04-builder-joy.webp" alt="만들 때의 나 — 한 가지 문제에 푹 빠짐, 데모가 돌면 신남, 기능 하나 더 또 하나 더, 이 정도면 다들 쓰겠지. 나도 그랬다. 만드는 재미에 빠질 때 쓸 사람은 아직 안 보인다" loading="lazy" /></div>
  <div class="slide"><img src="05-divider-who-uses.webp" alt="섹션 ① 그런데, 누가 쓸까 — 만든 사람의 확신, 쓰는 사람의 현실" loading="lazy" /></div>
  <div class="slide"><img src="06-mirror-questions.webp" alt="손 들어보기 — 동료가 만든 에이전트를 지난 한 달 써봤다, 배워야 쓰는 사내 시스템을 자발적으로 써봤다, 빅테크 에이전트를 매일 쓴다. 귀찮아서·어디에 쓸지 몰라서. 빅테크 것도 안 쓰는데 내 것은 어떨까?" loading="lazy" /></div>
  <div class="slide"><img src="07-belief-vs-reality.webp" alt="확신과 현실 사이 — 만든 사람: IKEA 효과(Norton 2012), 기능의 80%는 거의 안 쓰임(Pendo 2019). 쓰는 사람: ChatGPT Agent 주간 유료 이용자 약 75% 이탈(보도 2026.1), 사내 자체 구축 AI의 배포 성공률은 외부 도입의 절반(MIT NANDA 2025), 미국 직장인 12%만 AI를 매일 사용(Gallup 2025). 쓸 사람에게 물어본 적 있었나? (나도 없었다)" loading="lazy" /></div>
  <div class="slide"><img src="08-three-numbers.webp" alt="숫자로 보면 — 2027년까지 취소될 에이전틱 AI 프로젝트 40%+(Gartner 2025), 실제 배포 조직 17%(Gartner 2026), 일부 워크플로우를 재설계한 기업 21%(McKinsey 2025). 만드는 건 빨라졌고 일하는 방식은 천천히 바뀐다 (포스트잇: 내 에이전트 — 누가, 매일 쓸까?)" loading="lazy" /></div>
  <div class="slide"><img src="09-divider-order.webp" alt="섹션 ② 순서가 뒤집혔다 — 서비스부터 만들 때 생기는 일" loading="lazy" /></div>
  <div class="slide"><img src="10-ax-not-system.webp" alt="AX ≠ 시스템 — 원래 순서: 일하는 방식, 프로세스로 굳음, 시스템. 지금 순서: 서비스부터, 프로세스는 나중에, 사람이 적응. 그릇보다 담을 일이 먼저" loading="lazy" /></div>
  <div class="slide"><img src="11-unsettled-process.webp" alt="굳지 않은 프로세스를 부으면 — 프로세스 변경, 수정 요청, 수정이 못 따라감, 방치의 순환. 프로세스는 AI 속도로, 서비스는 배포 주기로" loading="lazy" /></div>
  <div class="slide"><img src="12-history.webp" alt="이 영화, 우리 회사에서 이미 봤다 — 개인 PC, 조직별 개발서버, 주인 없는 서버, 1서비스 1운영자, SE·인프라 조직. 에이전트는 지금 조직별 개발서버 단계. 출시는 눈에 띄고 유지는 눈에 안 띈다" loading="lazy" /></div>
  <div class="slide"><img src="13-banner-midpoint.webp" alt="배포는 쉽고, 운영은 어렵다 — 론칭 뒤의 1년, 진짜 난이도는 거기에 (포스트잇: 내 에이전트 — 1년 뒤엔 누가 운영하지?)" loading="lazy" /></div>
  <div class="slide"><img src="14-divider-ops.webp" alt="섹션 ③ 운영의 두 벽 — 권한 · 지식" loading="lazy" /></div>
  <div class="slide"><img src="15-permission.webp" alt="권한 — 운영의 첫 번째 벽. 에이전트는 누구 권한으로 읽고 쓰나 — 사용자별 위임, 문서별 접근 제어, 행동 승인, 감사 로그, 토큰 범위와 만료. 열면 사고(Replit 운영 DB 삭제, Lovable 앱 10% 데이터 노출), 못 열면 소수만 쓰는 도구. AI 관련 침해 조직 97% 적절한 접근 통제 부재(IBM 2025)" loading="lazy" /></div>
  <div class="slide"><img src="16-voc-case.webp" alt="SWDP VOC 사례 — 변화가 빠른 서비스에서. FAQ·지식 갱신 요청, 가이드가 노이즈, 검토 폭증, 채택 실패. AI가 이미 아는 질문과 사람이 해야 하는 일 사이의 얇은 KB 구간. 굳지 않은 일을 문서로 굳혔다" loading="lazy" /></div>
  <div class="slide"><img src="17-llm-wiki-five.webp" alt="LLM Wiki가 어려운 다섯 가지 — 누가 쓰나, 언제 낡나, 무엇이 정답인가, 어디까지 넣나, 누가 지우나. 쓰는 사람은 있어도 지우는 사람은 없다" loading="lazy" /></div>
  <div class="slide"><img src="18-bad-knowledge.webp" alt="쌓인다고 좋은 게 아니다 — 낡은 문서끼리 충돌(DRAGged into Conflicts), 무관한 맥락, Lost in the Middle, PoisonedRAG. 좋은 모델 + 나쁜 지식 = 자신 있는 오답" loading="lazy" /></div>
  <div class="slide"><img src="19-three-clocks.webp" alt="세 개의 시계(내 경험상) — 모델은 몇 달, 도메인·일하는 방식은 몇 주, 사람의 검토는 분기 또는 안 함. 지식의 수명이 검토 주기보다 짧다" loading="lazy" /></div>
  <div class="slide"><img src="20-banner-climax.webp" alt="인지는 유한하다 — 사람이 AI 속도로 뛰지 않아도 되게 (Grudin 1988, Upwork 2024) (포스트잇: 내 에이전트 — 지식은 누가 갱신하지?)" loading="lazy" /></div>
  <div class="slide"><img src="21-divider-path.webp" alt="섹션 ④ 길이 나면 포장한다 — 먼저 다닌 길 위에 서비스를" loading="lazy" /></div>
  <div class="slide"><img src="22-paved-already.webp" alt="되는 곳은 이미 길이 나 있었다 — 코딩 에이전트는 git·PR·CI·테스트가, 고객 상담(Intercom Fin)은 상담 프로세스와 해결률 지표가 먼저. 에이전트가 해내는 작업 길이는 약 7개월마다 2배(METR 2025). 에이전트는 이미 난 길 위에서 달린다" loading="lazy" /></div>
  <div class="slide"><img src="23-graduation.webp" alt="졸업 순서 — 개인 하네스, 팀 워크플로우, 서비스. 굳히는 건 절차가 아니라 계약(입출력·권한·검증·주인). 그 아래 공통으로 깔아야 할 권한·인증·감사 플랫폼. 권한은 서비스마다 만들 게 아니라 길 아래 깔려 있어야" loading="lazy" /></div>
  <div class="slide"><img src="24-read-dont-feed.webp" alt="먹이지 말고 읽혀라 — 사람이 KB를 써서 넣는 대신 라이브 데이터·변경 이력·티켓을 그때그때 조회. AI를 먹이지 말고 일의 흔적을 읽혀라 (포스트잇: 내 에이전트 — 사람이 먹이나, 일에서 읽나?)" loading="lazy" /></div>
  <div class="slide"><img src="25-checklist.webp" alt="내 에이전트에 대입해보기 — 쓸 사람이 먼저 달라고 했나로 시작하는 일곱 가지 사전 점검과 운영 계약(등록·소유자·평가·섭종 계획). 만들면서 1년 운영할 그림도 같이" loading="lazy" /></div>
  <div class="slide"><img src="26-closing.webp" alt="정리하며 — 쓸 사람이 먼저, 길이 나면 포장하자, 지식은 먹이지 말고 읽히자. 다시, 내 에이전트: 누가 매일 쓸까, 1년 뒤엔 누가 운영하지, 지식은 누가 갱신하지, 사람이 먹이나 일에서 읽나. 바람의나라는 쓰는 사람이 있어서 30년 — 내 에이전트는 1년 뒤? 론칭할 때 섭종 계획도 같이" loading="lazy" /></div>
  <div class="slide"><img src="27-appendix-workflow-vs-agent.webp" alt="부록 — Workflow vs Agent — 코드가 다음 단계를 정하면 Workflow, LLM이 도구·루프·목표로 다음 단계를 정하면 Agent. 판별 3문항과 agent washing(Gartner 2025). 루프가 있어야 에이전트" loading="lazy" /></div>
</div>
<nav aria-label="슬라이드 이동" class="nav"><button aria-label="이전 슬라이드" onclick="prev()">&larr;</button><button aria-label="다음 슬라이드" onclick="next()">&rarr;</button></nav>
<div class="page-num" id="pageNum" aria-live="polite" aria-atomic="true">1 / 1</div>
<script>
const slides=document.querySelectorAll('.slide'),total=slides.length;
let current=0;
const pageNumEl=document.getElementById('pageNum'),progressEl=document.getElementById('progress');
slides.forEach((slide,index)=>{slide.setAttribute('role','group');slide.setAttribute('aria-roledescription','슬라이드');slide.setAttribute('aria-label',`${index+1} / ${total}`);});
function update(){slides.forEach((s,i)=>{const active=i===current;s.classList.toggle('active',active);s.setAttribute('aria-hidden',String(!active));});if(!pageNumEl||!progressEl)return;pageNumEl.textContent=`${current+1} / ${total}`;progressEl.style.width=total>1?`${(current/(total-1))*100}%`:'100%';
  [current+1,current+2,current-1].forEach(i=>{if(i>=0&&i<total){const img=slides[i].querySelector('img');if(img&&img.loading==='lazy'){img.loading='eager';}}});
}
function goTo(i){if(total===0)return;if(i<0)i=0;if(i>=total)i=total-1;current=i;try{history.replaceState(null,'','#'+(current+1));}catch(e){}update();}
function next(){goTo(current+1);}
function prev(){goTo(current-1);}
document.addEventListener('keydown',e=>{const tag=document.activeElement.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||document.activeElement.isContentEditable)return;switch(e.key){case'ArrowRight':case' ':case'PageDown':e.preventDefault();next();break;case'ArrowLeft':case'PageUp':e.preventDefault();prev();break;case'Home':e.preventDefault();goTo(0);break;case'End':e.preventDefault();goTo(total-1);break;case'f':case'F':const el=document.documentElement;const isFs=document.fullscreenElement||document.webkitFullscreenElement;if(!isFs){(el.requestFullscreen||el.webkitRequestFullscreen).call(el)?.catch(()=>{});}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)?.catch(()=>{});}break;}});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{if(e.touches.length>1)return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(e.changedTouches.length>1)return;const dx=tx-e.changedTouches[0].clientX,dy=ty-e.changedTouches[0].clientY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){if(dx>0)next();else prev();}},{passive:true});
const initSlide=parseInt(location.hash.slice(1))-1;
if(!isNaN(initSlide)&&initSlide>=0)goTo(initSlide);else update();
</script>
</body>
