<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../base.css">
<script src="../svg.js"></script>
<title>money-stocks</title>
</head><body>
<div class="card">
  <div class="title">FT 보도 당일(10.8) 주가 등락률</div>
  <div class="sub">“오픈AI 연환산 매출 500억 달러 근접” 보도가 나온 날의 등락률</div>
  <div class="source">자료: 실리콘앵글 등 보도 종합 (2026. 10. 8 미국 증시)</div>
</div>
<svg class="plot" id="p" width="1600" height="900"></svg>
<script>
const rows = [
  { name: '나스닥 지수', v: -1.25, index: true },
  { name: '엔비디아', v: -2.9 },
  { name: 'AMD', v: -4 },
  { name: '브로드컴', v: -4 },
  { name: '오라클', v: -5.5 },
  { name: '코어위브', v: -8 },
];
// 하락은 국내 증시 관례대로 파랑(청람). 지수는 개별 종목과 구분해 회색.
const Z = 1230, VMIN = -8, LEFT = 300, Y = 250, ROW = 78, BH = 44, SEP = 18;
const w = (v) => v / VMIN * (Z - LEFT);
const svg = document.getElementById('p');
const pct = (v) => '−' + Math.abs(v) + '%';
const yEnd = Y + ROW * rows.length + SEP;
for (let v = 0; v >= VMIN; v -= 2) {
  el(svg, 'line', { class: v ? 'grid' : 'axis', x1: Z - w(v), x2: Z - w(v), y1: Y - 14, y2: yEnd });
  el(svg, 'text', { x: Z - w(v), y: yEnd + 32, 'text-anchor': 'middle', 'font-size': 22, class: 'muted' }, v ? pct(v) : '0');
}
rows.forEach((r, i) => {
  const y0 = Y + i * ROW + (r.index ? 0 : SEP);
  bar(svg, Z - w(r.v), y0, w(r.v), BH, r.index ? '#8d7c66' : '#2a4264', 'left');
  el(svg, 'text', { x: Z - w(r.v) - 14, y: y0 + BH / 2 + 10, 'text-anchor': 'end', 'font-size': 28, 'font-weight': 600 }, pct(r.v));
  el(svg, 'text', { x: Z + 24, y: y0 + BH / 2 + 10, 'font-size': 28, 'font-weight': r.index ? 400 : 600, ...(r.index ? { class: 'muted' } : {}) }, r.name);
});
el(svg, 'line', { class: 'grid', x1: Z + 20, x2: 1520, y1: Y + ROW + SEP / 2 - 8, y2: Y + ROW + SEP / 2 - 8 });
</script>
</body></html>
