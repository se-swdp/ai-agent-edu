<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../base.css">
<script src="../svg.js"></script>
<title>korea-ai-budget</title>
</head><body>
<div class="card">
  <div class="title">2027년 과기정통부 AI 예산안, 안전·신뢰는 0.29%</div>
  <div class="sub">전체 9조 4,308억 원을 100%로 놓은 비중</div>
  <div class="source">자료: 과학기술정보통신부 2027년 예산안 (데일리안 보도) · ‘기타’는 전체에서 두 항목을 뺀 계산값</div>
</div>
<svg class="plot" id="p" width="1600" height="900"></svg>
<script>
const TOTAL = 94308, PERF = 61490, SAFE = 274, REST = TOTAL - PERF - SAFE;   // 단위: 억 원
const X0 = 80, X1 = 1520, Y = 460, BH = 160, GAP = 2;
const w = (v) => v / TOTAL * (X1 - X0);
const pctOf = (v, d = 1) => (v / TOTAL * 100).toFixed(d) + '%';
const svg = document.getElementById('p');
const xS = X0 + w(PERF), xR = xS + w(SAFE);
// segments separated by 2px paper gaps; the safety sliver keeps its true width
bar(svg, X0, Y, w(PERF) - GAP, BH, '#2a4264', 'left');
el(svg, 'rect', { x: xS, y: Y, width: w(SAFE), height: BH, fill: '#b0392e' });
bar(svg, xR + GAP, Y, X1 - xR - GAP, BH, '#e9e0cf', 'right');
// in-bar labels
el(svg, 'text', { x: X0 + 32, y: Y + 68, 'font-size': 32, 'font-weight': 600, fill: '#fffcf6' }, '성능·인프라');
el(svg, 'text', { x: X0 + 32, y: Y + 114, 'font-size': 28, fill: '#fffcf6' }, fmtWon(PERF) + ' 원 · ' + pctOf(PERF));
el(svg, 'text', { x: xR + 32, y: Y + 68, 'font-size': 32, 'font-weight': 600 }, '기타');
el(svg, 'text', { x: xR + 32, y: Y + 114, 'font-size': 28, class: 'muted' }, fmtWon(REST) + ' 원 · ' + pctOf(REST));
// callout to the sliver
const cx = xS + w(SAFE) / 2;
el(svg, 'path', { d: `M${cx} ${Y - 8}V${Y - 70}H${cx + 36}`, fill: 'none', stroke: '#b0392e', 'stroke-width': 2 });
el(svg, 'text', { x: cx + 48, y: Y - 60, 'font-size': 36, 'font-weight': 700, fill: '#b0392e' }, '안전·신뢰 ' + fmtWon(SAFE) + ' 원');
el(svg, 'text', { x: cx + 48, y: Y - 22, 'font-size': 26, class: 'muted' }, '전체의 ' + pctOf(SAFE, 2));
// percent scale under the bar
const SY = Y + BH + 24;
el(svg, 'line', { class: 'axis', x1: X0, x2: X1, y1: SY, y2: SY });
for (const p of [0, 25, 50, 75, 100]) {
  const px = X0 + p / 100 * (X1 - X0);
  el(svg, 'line', { class: 'axis', x1: px, x2: px, y1: SY, y2: SY + 10 });
  el(svg, 'text', { x: px, y: SY + 40, 'text-anchor': p === 0 ? 'start' : p === 100 ? 'end' : 'middle', 'font-size': 22, class: 'muted' }, p + '%');
}
</script>
</body></html>
